{{define "main"}}

{{ partial "page-header.html" . }}

<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="content">
          {{.Content}}
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section pt-0">
  <div class="container">
    <div class="row gx-sm-5 gy-5 justify-content-center">
    {{range where site.RegularPages "Section" "cars"}}
    <div class="col-xl-3 col-lg-4 col-sm-6" data-aos="fade-in">
      <a href="{{.RelPermalink}}" class="d-block text-reset h-100">
        <div class="card products-card is-hoverable h-100">
          <div class="card-body p-5 pb-0">
            {{with .Params.icon}}<span class="h3 d-inline-block mb-4"><i class="text-primary {{.}}"></i></span>{{end}}
            <h3 class="h5">{{.Title | markdownify}}</h3>
            <div class="mt-3">
              <div class="content mb-4">{{.Params.description}}</div>
            </div>
            {{with .Params.passengers}}
            <div class="mb-3">
              <small class="text-muted"><i class="fas fa-users me-1"></i> {{.}} passengers</small>
            </div>
            {{end}}
          </div>
          <div class="card-footer p-5 pt-0 border-0 bg-transparent">
            <span class="text-primary fw-500">View Details <i class="fas fa-arrow-right small ms-1"></i> </span>
          </div>
        </div>
      </a>
    </div>
    {{end}}
    </div>
  </div>
</section>

{{end}}
